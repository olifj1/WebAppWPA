<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Multi Button Test</title>
</head>
<body>
  <main class="app">
    <div class="card">
      <p class="eyebrow">PWA TEST · V2</p>
      <h1>Multi Button Tap</h1>
      <div id="count">0</div>

      <div class="button-grid">
        <button data-change="-1">−1</button>
        <button data-change="1">+1</button>
        <button data-change="5">+5</button>
        <button id="reset" class="secondary">Reset</button>
      </div>

      <p class="status">
        The number is saved locally, so it should still be here after you close and reopen the app.
      </p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
