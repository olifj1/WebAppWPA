<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5c56b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Learning Play">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Learning Play</title>
</head>
<body>
  <div class="app-shell">
    <main class="screen-wrap">
      <section class="screen active" id="numbers-screen" aria-labelledby="numbers-title">
        <div class="numbers-page">
          <header class="page-header">
            <p class="kicker">LEARNING PLAY</p>
            <h1 id="numbers-title">Multiply</h1>
            <p class="subhead">Choose a number, then tap to add it again.</p>
          </header>

          <div class="number-picker" aria-label="Choose a number">
            <button class="round-control" id="number-down" aria-label="Decrease number">−</button>
            <div class="chosen-number" id="chosen-number">4</div>
            <button class="round-control" id="number-up" aria-label="Increase number">+</button>
          </div>

          <button class="tap-button" id="tap-number" aria-label="Add the chosen number">
            <span class="tap-small">TAP TO ADD</span>
            <span class="tap-big" id="tap-value">4</span>
          </button>

          <div class="total-card">
            <div class="total-label">TOTAL</div>
            <div class="total-value" id="total-value">0</div>
            <div class="equation" id="equation">Tap the button to begin</div>
          </div>

          <div class="tap-history">
            <div class="tap-dots" id="tap-dots" aria-hidden="true"></div>
            <div class="tap-count" id="tap-count">0 taps</div>
          </div>

          <button class="text-button" id="numbers-reset">Reset</button>
        </div>
      </section>

      <section class="screen" id="clock-screen" aria-labelledby="clock-title">
        <div class="clock-page" id="clock-page">
          <header class="page-header clock-header">
            <p class="kicker">LEARNING PLAY</p>
            <h1 id="clock-title">Tell the Time</h1>
            <p class="subhead">Move through the whole day and watch the clock and sky change together.</p>
          </header>

          <div class="clock-stage">
            <svg class="clock-face" viewBox="0 0 300 300" role="img" aria-label="Analogue clock">
              <circle class="clock-rim" cx="150" cy="150" r="138"></circle>
              <circle class="clock-inner" cx="150" cy="150" r="124"></circle>
              <g class="ticks" id="clock-ticks"></g>
              <g class="clock-number-group">
                <text x="150" y="55">12</text>
                <text x="246" y="158">3</text>
                <text x="150" y="258">6</text>
                <text x="54" y="158">9</text>
              </g>
              <line class="hour-hand" id="hour-hand" x1="150" y1="150" x2="150" y2="88"></line>
              <line class="minute-hand" id="minute-hand" x1="150" y1="150" x2="150" y2="58"></line>
              <circle class="clock-pin" cx="150" cy="150" r="8"></circle>
            </svg>
          </div>

          <div class="digital-time" id="digital-time">12:00</div>
          <div class="day-label" id="day-label">Midday</div>

          <div class="slider-card">
            <div class="slider-row">
              <div class="slider-heading"><span>Hour</span><strong id="hour-readout">12</strong></div>
              <input id="hour-slider" type="range" min="0" max="23" value="12" step="1" aria-label="Hour">
              <div class="range-ends"><span>00</span><span>12</span><span>23</span></div>
            </div>
            <div class="slider-row">
              <div class="slider-heading"><span>Minute</span><strong id="minute-readout">00</strong></div>
              <input id="minute-slider" type="range" min="0" max="59" value="0" step="1" aria-label="Minute">
              <div class="range-ends"><span>00</span><span>30</span><span>59</span></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Learning activities">
      <button class="tab active" data-screen="numbers-screen" aria-current="page"><span class="tab-icon">×</span><span>Numbers</span></button>
      <button class="tab" data-screen="clock-screen"><span class="tab-icon clock-icon">◷</span><span>Clock</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
